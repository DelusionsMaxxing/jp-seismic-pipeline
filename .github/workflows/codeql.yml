name: CodeQL

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyse:
    name: Analyse Python
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: github/codeql-action/init@v4
        with:
          languages: python
          # The default suite finds injection and traversal; security-and-quality
          # also catches the dead code and unused-variable class of defect that
          # ruff does not look for.
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v4
