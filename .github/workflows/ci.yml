name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# Read-only by default: nothing in CI needs to write to the repository, and
# the default token is writable unless it is narrowed here.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Ruff format
        run: ruff format --check .

      - name: Ruff
        run: ruff check src tests dags

      - name: Pytest
        run: pytest

  dbt:
    name: dbt build against Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: seismic
          POSTGRES_PASSWORD: seismic
          POSTGRES_DB: seismic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U seismic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: seismic
      POSTGRES_PASSWORD: seismic
      POSTGRES_DB: seismic
      DBT_PROFILES_DIR: ${{ github.workspace }}/dbt

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dbt
        run: pip install dbt-core==1.8.9 dbt-postgres==1.8.2

      - name: Apply warehouse DDL and load fixtures
        env:
          PGPASSWORD: seismic
        run: |
          psql -h localhost -U seismic -d seismic -v ON_ERROR_STOP=1 \
            -f sql/init/01_schemas.sql
          psql -h localhost -U seismic -d seismic -v ON_ERROR_STOP=1 \
            -f sql/fixtures/sample_events.sql

      - name: dbt deps
        working-directory: dbt
        run: dbt deps

      # `build` runs models and their tests in dependency order, so a broken
      # assumption fails the pipeline at the model that introduced it.
      - name: dbt build
        working-directory: dbt
        run: dbt build --target dev

      # Re-running proves the incremental branch of fct_earthquakes compiles
      # and merges correctly, which a first-run-only check never exercises.
      - name: dbt build (incremental re-run)
        working-directory: dbt
        run: dbt build --target dev

  dags:
    name: DAG import
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Airflow is not a package dependency — it comes from the base image at
      # runtime — so CI installs the same version the Dockerfile pins, with
      # Airflow's own constraints file to keep the resolve reproducible.
      - name: Install Airflow
        run: |
          pip install "apache-airflow==2.10.3" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.3/constraints-3.11.txt"

      - name: Install package
        run: pip install -e ".[dev]"

      - name: Import every DAG
        run: pytest -q -m airflow

  monitoring:
    name: Validate monitoring config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # A malformed alert rule is only discovered when Prometheus refuses to
      # start, which is exactly when you need it most.
      - name: promtool check config and rules
        run: |
          docker run --rm -v "$PWD/monitoring/prometheus:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v2.55.1 \
            check config /etc/prometheus/prometheus.yml

      - name: amtool check-config
        run: |
          docker run --rm -v "$PWD/monitoring/alertmanager:/etc/alertmanager:ro" \
            --entrypoint amtool prom/alertmanager:v0.28.0 \
            check-config /etc/alertmanager/alertmanager.yml

      - name: Dashboards parse as JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path("monitoring/grafana/dashboards").glob("*.json")):
              json.loads(path.read_text(encoding="utf-8"))
              print(f"ok {path}")
          PY
