[build-system]
# 83 is the floor rather than a preference: PYSEC-2026-3447 lets a MANIFEST.in
# exclusion be bypassed when building an sdist on a normalisation-preserving
# filesystem, and it is fixed there.
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "jp-seismic"
version = "0.1.0"
description = "ELT pipeline for Japanese seismic activity"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "requests>=2.32",
    "psycopg[binary]>=3.2",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "responses>=0.25",
    "ruff>=0.7",
]

[project.scripts]
jp-seismic = "jp_seismic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "airflow: needs apache-airflow installed; skipped unless it is present",
]
