[build-system]
# 83 is the floor rather than a preference: PYSEC-2026-3447 lets a MANIFEST.in
# exclusion be bypassed when building an sdist on a normalisation-preserving
# filesystem, and it is fixed there.
requires = ["setuptools>=83"]
build-backend = "setuptools.build_meta"

[project]
name = "jp-seismic"
version = "0.1.0"
description = "ELT pipeline for Japanese seismic activity"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "requests>=2.32",
    "psycopg[binary]>=3.2",
    "prometheus-client>=0.21",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.3",
    "pytest>=8.3",
    "pytest-cov>=7.1",
    "responses>=0.25",
    "ruff>=0.16",
    # Build tooling rather than a test dependency, but the dependency audit
    # scans the resolved environment, and the setuptools a runner's Python
    # ships is old enough to carry PYSEC-2026-3447. Declaring the floor here is
    # what makes the environment clean; the same floor under [build-system]
    # only governs the isolated build.
    "setuptools>=83",
]

[project.scripts]
jp-seismic = "jp_seismic.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
# C90 and the PLR rules turn the size guidance in CLAUDE.md into a check. The
# thresholds below are that guidance, not ruff's defaults.
select = ["E", "F", "I", "UP", "B", "SIM", "C90", "PLR0912", "PLR0913", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
# Stands in for the ~40 line guidance: ruff counts statements, not lines, so
# this trips slightly later than a literal line count would.
max-statements = 40

[tool.mypy]
python_version = "3.11"
files = ["src", "tests"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
strict_equality = true

[[tool.mypy.overrides]]
# Airflow is supplied by the base image, not by this package, so it is absent
# from the environment mypy runs in everywhere except the DAG import job.
module = ["airflow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# The coverage floor is the number the suite reaches today, not an aspiration:
# a floor nobody can meet gets lowered or deleted, which is worse than no floor.
addopts = "-q --strict-markers --cov=jp_seismic --cov-report=term-missing --cov-fail-under=70"
markers = [
    "airflow: needs apache-airflow installed; skipped unless it is present",
]
