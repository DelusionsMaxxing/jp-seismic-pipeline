name: jp-seismic-pipeline

x-airflow-common: &airflow-common
  build: .
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
      postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    # Scheduler and task metrics leave over StatsD and are translated into
    # Prometheus series by statsd-exporter.
    AIRFLOW__METRICS__STATSD_ON: "true"
    AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
    AIRFLOW__METRICS__STATSD_PORT: "9125"
    AIRFLOW__METRICS__STATSD_PREFIX: airflow
    DBT_PROJECT_DIR: /opt/airflow/dbt
    DBT_PROFILES_DIR: /opt/airflow/dbt
    # dbt writes target/ and logs/ next to the project, and the project is a
    # bind mount that keeps the host user's ownership on Linux — the container
    # cannot create anything in it. Both are derived artefacts, so they go
    # somewhere writable inside the container instead.
    DBT_TARGET_PATH: /tmp/dbt/target
    DBT_LOG_PATH: /tmp/dbt/logs
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USER: seismic
    POSTGRES_PASSWORD: ${SEISMIC_PASSWORD:-seismic}
    POSTGRES_DB: seismic
    # Ingest exits between runs, so its metrics are pushed rather than scraped.
    PUSHGATEWAY_URL: http://pushgateway:9091
  volumes:
    - ./dags:/opt/airflow/dags
    - ./dbt:/opt/airflow/dbt
    # Puts the dbt_packages the Dockerfile vendors back on top of the bind
    # mount that shadows them. Docker seeds a named volume from the image the
    # first time it is used, so this needs neither network nor a write to the
    # host checkout — and the container cannot write there anyway on Linux.
    # The trade-off is the usual one for seeded volumes: after changing
    # packages.yml, `make clean` before `make up`, or the old packages stay.
    - dbt-packages:/opt/airflow/dbt/dbt_packages
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      # Airflow's metadata DB is created by the image; the warehouse DB and
      # its schemas come from the init scripts below.
      POSTGRES_DB: airflow
      # Consumed by bootstrap.sh when it creates the warehouse and monitoring
      # roles. The defaults keep a laptop working with no .env at all; any
      # environment that is not a laptop overrides them.
      SEISMIC_PASSWORD: ${SEISMIC_PASSWORD:-seismic}
      READONLY_PASSWORD: ${READONLY_PASSWORD:-readonly}
      EXPORTER_PASSWORD: ${EXPORTER_PASSWORD:-exporter}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d/warehouse:ro
      - ./sql/bootstrap.sh:/docker-entrypoint-initdb.d/00_bootstrap.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname Admin --lastname User \
          --role Admin --email admin@example.com || true
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # --- monitoring -----------------------------------------------------------

  pushgateway:
    image: prom/pushgateway:v1.10.0
    ports:
      - "9091:9091"
    restart: unless-stopped

  statsd-exporter:
    image: prom/statsd-exporter:v0.28.0
    command:
      - --statsd.mapping-config=/etc/statsd/mapping.yml
      - --statsd.listen-udp=:9125
      - --web.listen-address=:9102
    volumes:
      - ./monitoring/statsd/mapping.yml:/etc/statsd/mapping.yml:ro
    ports:
      - "9102:9102"
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    environment:
      DATA_SOURCE_NAME: >-
        postgresql://seismic_exporter:${EXPORTER_PASSWORD:-exporter}@postgres:5432/seismic?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9187:9187"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/loki-config.yaml"]
    volumes:
      - ./monitoring/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.5.1
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    # Reading the Docker socket needs root; everything Alloy touches is mounted
    # read-only.
    user: root
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - airflow-logs:/opt/airflow/logs:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki
    ports:
      - "12345:12345"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.0
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      # Needed for the "silence" links in notifications to point somewhere real.
      - --web.external-url=http://localhost:9093
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # Interpolated into the provisioned Postgres datasource, so the read-only
      # password never sits in a committed file.
      GRAFANA_DB_PASSWORD: ${READONLY_PASSWORD:-readonly}
    volumes:
      # Mounted per subdirectory: replacing the whole provisioning directory
      # hides the empty alerting/ and plugins/ folders the image ships, and
      # Grafana logs an error for each on every start.
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - alertmanager
      - loki
      - postgres
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  postgres-data:
  airflow-logs:
  dbt-packages:
  prometheus-data:
  alertmanager-data:
  loki-data:
  alloy-data:
  grafana-data:
