global:
  resolve_timeout: 5m

route:
  receiver: default
  # Grouped by source as well as alertname: a problem with one feed must not
  # be silenced by an identical one already firing for another.
  group_by: ["alertname", "source"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 12h
  routes:
    - matchers:
        - severity = "critical"
      receiver: default
      repeat_interval: 1h

inhibit_rules:
  # While the warehouse is unreachable, every ingest alert is a symptom of the
  # same outage. Suppress them so the page names the cause, not the effects.
  - source_matchers:
      - alertname = "SeismicWarehouseUnreachable"
    target_matchers:
      - severity =~ "warning|critical"
    equal: ["project"]

receivers:
  # No integration configured yet: alerts are deduplicated, grouped and
  # silenceable in the Alertmanager UI on :9093, but nothing leaves the host.
  # Wiring a real channel means adding telegram_configs / slack_configs /
  # email_configs here, with the token read from a *_file mount rather than
  # written into this file.
  - name: default
